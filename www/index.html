<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06080c" />
  <title>Окно в 3:00</title>
  <style data-file="style.css">
:root {
  --bg-deep: #06080c;
  --glass-bg: rgba(12, 16, 24, 0.56);
  --glass-bg-strong: rgba(10, 13, 20, 0.82);
  --glass-border: rgba(210, 224, 248, 0.12);
  --glass-highlight: rgba(255, 255, 255, 0.06);
  --text-main: rgba(236, 241, 248, 0.92);
  --text-muted: rgba(176, 190, 212, 0.62);
  --accent-warm: #d9b48f;
  --accent-cool: #8db3d9;
  --polaroid-border: rgba(255, 255, 255, 0.09);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}

.hidden {
  display: none !important;
}

/* ===== WebGL Canvas ===== */
#rain-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
  touch-action: none;
}

/* Киношная виньетка и силуэт тёмного подоконника */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 42%, transparent 44%, rgba(3, 5, 10, 0.58) 100%),
    linear-gradient(to bottom, rgba(4, 6, 11, 0.45) 0%, transparent 18%, transparent 72%, rgba(3, 5, 9, 0.88) 100%);
}

.sill-ledge {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(36px + var(--safe-bottom));
  z-index: 3;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(16, 20, 28, 0.55), rgba(5, 7, 10, 0.96) 28%);
  border-top: 1px solid rgba(205, 220, 245, 0.08);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.65);
}

/* ===== Главный HUD (строго 1 экран) ===== */
#hud {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: calc(14px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));
  pointer-events: none;
}

/* ===== Верхняя панель ===== */
.top-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.clock-widget {
  pointer-events: auto;
  background: transparent;
  border: none;
  text-align: left;
  color: inherit;
  cursor: pointer;
  padding: 2px 4px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.clock-time {
  font-size: 30px;
  font-weight: 300;
  letter-spacing: 0.08em;
  line-height: 1;
  color: rgba(242, 246, 252, 0.92);
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
  font-variant-numeric: tabular-nums;
}

.clock-sub {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: lowercase;
  color: var(--text-muted);
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
}

.top-actions {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  border-radius: 999px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.36);
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-main);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease;
}

.icon-btn svg {
  width: 17px;
  height: 17px;
}

.icon-btn:active {
  background: rgba(141, 179, 217, 0.18);
  transform: scale(0.92);
}

/* ===== Подсказка в центре ===== */
.wipe-hint {
  align-self: center;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: lowercase;
  color: rgba(226, 234, 246, 0.56);
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(8, 11, 18, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.wipe-hint.fade-out {
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
}

/* ===== Нижняя зона подоконника ===== */
.windowsill-zone {
  display: grid;
  grid-template-columns: 128px 1fr;
  align-items: end;
  gap: 11px;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  pointer-events: none;
}

/* ===== Тёмный полароид Кристины ===== */
.polaroid-card {
  pointer-events: auto;
  position: relative;
  width: 128px;
  padding: 7px 7px 9px;
  border-radius: 6px;
  background: linear-gradient(160deg, #171b24 0%, #0e1117 100%);
  border: 1px solid var(--polaroid-border);
  box-shadow:
    0 14px 30px rgba(0, 0, 0, 0.72),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transform: rotate(-2.4deg);
  transform-origin: bottom center;
  transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.32s ease;
  z-index: 12;
}

.polaroid-card.expanded {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(86vw, 330px);
  padding: 12px 12px 16px;
  border-radius: 10px;
  transform: translate(-50%, -50%) rotate(-0.8deg);
  box-shadow:
    0 28px 70px rgba(0, 0, 0, 0.88),
    0 0 0 1px rgba(255, 255, 255, 0.1);
  z-index: 40;
}

.polaroid-top-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
  padding: 0 1px;
}

.polaroid-counter {
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.polaroid-tool-btns {
  display: flex;
  align-items: center;
  gap: 5px;
}

.mini-circle-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-main);
  display: grid;
  place-items: center;
  cursor: pointer;
}

.mini-circle-btn svg {
  width: 11px;
  height: 11px;
}

.polaroid-card.expanded .mini-circle-btn {
  width: 28px;
  height: 28px;
}

.polaroid-card.expanded .mini-circle-btn svg {
  width: 14px;
  height: 14px;
}

.polaroid-close-only {
  display: none;
}

.polaroid-card.expanded .polaroid-close-only {
  display: grid;
}

.polaroid-photo-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 3px;
  overflow: hidden;
  background: radial-gradient(circle at 30% 25%, #1d2433, #0b0e14 85%);
  cursor: pointer;
  touch-action: pan-y;
}

.polaroid-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: contrast(1.04) saturate(0.92) brightness(0.92);
}

.polaroid-img.is-empty {
  display: none;
}

.polaroid-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 0.06em;
}

.polaroid-empty svg {
  width: 24px;
  height: 24px;
  opacity: 0.55;
}

.polaroid-gloss {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.11) 0%, transparent 42%, rgba(0, 0, 0, 0.24) 100%);
}

.polaroid-footer {
  margin-top: 7px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.polaroid-caption {
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: 11px;
  line-height: 1.25;
  color: rgba(232, 224, 214, 0.88);
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 26px;
}

.polaroid-card.expanded .polaroid-caption {
  font-size: 15px;
  line-height: 1.4;
  -webkit-line-clamp: 4;
  margin: 6px 0 4px;
}

.polaroid-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}

.polaroid-nav-btn,
.polaroid-edit-btn {
  border: none;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  border-radius: 6px;
  height: 22px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.15s ease, color 0.15s ease;
}

.polaroid-nav-btn {
  width: 26px;
  font-size: 15px;
  line-height: 1;
}

.polaroid-edit-btn {
  flex: 1;
}

.polaroid-edit-btn svg {
  width: 12px;
  height: 12px;
}

.polaroid-card.expanded .polaroid-nav-btn,
.polaroid-card.expanded .polaroid-edit-btn {
  height: 32px;
}

.polaroid-card.expanded .polaroid-nav-btn {
  width: 44px;
  font-size: 19px;
}

.polaroid-nav-btn:active,
.polaroid-edit-btn:active {
  background: rgba(255, 255, 255, 0.14);
  color: var(--text-main);
}

/* ===== Карточка ночной записки справа ===== */
.night-note-card {
  pointer-events: auto;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 11px 12px;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow:
    0 14px 34px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 var(--glass-highlight);
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}

.note-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.note-label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent-warm);
  opacity: 0.9;
}

.note-text {
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: 13px;
  line-height: 1.4;
  color: var(--text-main);
  min-height: 36px;
  transition: opacity 0.25s ease;
}

.note-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.note-pill-btn {
  padding: 7px 6px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease;
}

.note-pill-btn:active {
  background: rgba(255, 255, 255, 0.14);
  color: var(--text-main);
}

.mini-glass-btn {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  display: grid;
  place-items: center;
  font-size: 12px;
  cursor: pointer;
}

.mini-glass-btn svg {
  width: 13px;
  height: 13px;
}

/* ===== Модальные окна и шторки ===== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(3, 5, 10, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(3, 5, 10, 0.66);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.sheet-card {
  width: 100%;
  max-width: 340px;
  border-radius: 18px;
  padding: 18px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sheet-head h2 {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--text-main);
}

.slider-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.slider-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
}

.slider-group input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  outline: none;
}

.slider-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text-main);
  border: 2px solid #0d121b;
  box-shadow: 0 0 10px rgba(141, 179, 217, 0.45);
  cursor: pointer;
}

.sheet-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 4px;
}

.sheet-btn {
  padding: 10px;
  border-radius: 11px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  font-size: 12px;
  cursor: pointer;
}

.sheet-btn.primary {
  background: rgba(217, 180, 143, 0.2);
  border-color: rgba(217, 180, 143, 0.36);
  color: #f6e7d8;
}

.sheet-btn:active {
  background: rgba(255, 255, 255, 0.14);
}

.caption-card textarea {
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: rgba(4, 6, 10, 0.68);
  color: var(--text-main);
  padding: 11px 12px;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: 14px;
  resize: none;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}

.caption-card textarea:focus {
  border-color: rgba(217, 180, 143, 0.45);
}

/* Адаптив под узкие экраны */
@media (max-width: 375px) {
  .windowsill-zone {
    grid-template-columns: 114px 1fr;
    gap: 8px;
  }

  .polaroid-card {
    width: 114px;
    padding: 6px 6px 8px;
  }

  .night-note-card {
    padding: 9px 10px;
  }
}

</style>
<script>
(function(){
  function showErr(msg){
    var b = document.getElementById("__dc_err_bar");
    if(!b){
      b = document.createElement("div");
      b.id = "__dc_err_bar";
      b.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:999999;background:#2b1218;color:#fecdd3;border:1px solid #f43f5e;border-radius:12px;padding:10px 12px;font:12px/1.4 monospace;box-shadow:0 8px 24px rgba(0,0,0,.45);word-break:break-word;";
      (document.body || document.documentElement).appendChild(b);
    }
    b.textContent = "Ошибка в коде: " + msg;
  }
  window.addEventListener("error", function(e){ showErr(e.message || "Неизвестная ошибка"); });
  window.addEventListener("unhandledrejection", function(e){ showErr((e.reason && e.reason.message) || String(e.reason)); });
})();
</script>
</head>
<body>
  <!-- WebGL сцена: ночное стекло, капли с преломлением, запотевание и молнии -->
  <canvas id="rain-canvas" aria-label="Ночное окно под дождём"></canvas>

  <!-- Киношная виньетка и силуэт тёмного подоконника -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="sill-ledge" aria-hidden="true"></div>

  <!-- Затемнение при раскрытии полароида -->
  <div id="polaroid-backdrop" class="modal-backdrop hidden"></div>

  <!-- Интерфейс (строго 100dvh, пустое пространство пропускает касания к стеклу) -->
  <main id="hud">
    <!-- Верхняя панель -->
    <header class="top-bar">
      <button id="clock-widget" class="clock-widget" type="button" title="Переключить: 03:00 / реальное время">
        <span id="clock-time" class="clock-time">03:00</span>
        <span id="clock-sub" class="clock-sub">дождь · тихо</span>
      </button>

      <div class="top-actions">
        <button id="btn-fog" class="icon-btn" type="button" aria-label="Запотеть стекло снова" title="Запотеть снова">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 14.5C4 12 6 10 8.5 10c.5-2.8 2.9-5 5.8-5 3.3 0 5.9 2.6 5.9 5.9 0 .3 0 .6-.1.9 1.7.6 2.9 2.2 2.9 4.1 0 2.4-2 4.1-4.4 4.1H7.5C5.5 20 4 18.4 4 16.5" />
            <path d="M8 16h8" opacity="0.55" />
          </svg>
        </button>

        <button id="btn-thunder" class="icon-btn" type="button" aria-label="Вспышка молнии" title="Молния">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 4 14 11 14 10 22 20 10 13 10 13 2" />
          </svg>
        </button>

        <button id="btn-settings" class="icon-btn" type="button" aria-label="Настройки" title="Настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7" />
            <circle cx="9" cy="7" r="2" fill="#0d1118" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <circle cx="15" cy="12" r="2" fill="#0d1118" />
            <line x1="4" y1="17" x2="20" y2="17" />
            <circle cx="11" cy="17" r="2" fill="#0d1118" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Подсказка (исчезает после первого проведения пальцем по стеклу) -->
    <div id="wipe-hint" class="wipe-hint" aria-hidden="true">
      проведи пальцем по стеклу
    </div>

    <!-- Нижняя зона подоконника -->
    <section class="windowsill-zone" aria-label="Подоконник">
      <!-- Тёмный полароид с фото Кристины -->
      <article id="polaroid-card" class="polaroid-card" aria-label="Фото Кристины">
        <div class="polaroid-top-tools">
          <span id="polaroid-counter" class="polaroid-counter">0 / 0</span>
          <div class="polaroid-tool-btns">
            <button id="btn-add-photos" class="mini-circle-btn" type="button" title="Добавить фото с телефона" aria-label="Добавить фото">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
            <button id="btn-close-polaroid" class="mini-circle-btn polaroid-close-only" type="button" title="Свернуть" aria-label="Свернуть фото">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>

        <div id="polaroid-frame" class="polaroid-photo-wrap">
          <img id="polaroid-img" class="polaroid-img is-empty" alt="Кристина" draggable="false" />
          <div id="polaroid-empty" class="polaroid-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <circle cx="8.5" cy="9.5" r="1.5" />
              <path d="M21 15l-5-5L5 20" />
            </svg>
            <span>добавь фото</span>
          </div>
          <div class="polaroid-gloss" aria-hidden="true"></div>
        </div>

        <div class="polaroid-footer">
          <p id="polaroid-caption" class="polaroid-caption">тихая ночь с тобой</p>
          <div class="polaroid-nav-row">
            <button id="btn-photo-prev" class="polaroid-nav-btn" type="button" aria-label="Предыдущее фото">‹</button>

  <script data-file="shader.js">
(function (global) {

    'attribute vec2 a_pos;',
    'varying vec2 v_uv;',
    'void main() {',
    '  v_uv = a_pos * 0.5 + 0.5;',
    '  gl_Position = vec4(a_pos, 0.0, 1.0);',

  var FRAG_SRC = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH',
    'precision highp float;',
    '#else',
    'precision mediump float;',
    '#endif',
    '',
    'varying vec2 v_uv;',
    'uniform vec2 u_resolution;',
    'uniform float u_time;',
    'uniform sampler2D u_bgTex;',
    'uniform sampler2D u_wipeTex;',
    'uniform float u_bgAspect;',
    'uniform float u_rainIntensity;',
    'uniform float u_fogDensity;',
    'uniform float u_lightning;',
    '',
    'vec3 N13(float p) {',
    '  vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.11369, 0.13787));',
    '  p3 += dot(p3, p3.yzx + 19.19);',
    '  return fract(vec3((p3.x + p3.y) * p3.z, (p3.x + p3.z) * p3.y, (p3.y + p3.z) * p3.x));',
    '}',
    '',
    'float N21(vec2 p) {',
    '  p = fract(p * vec2(123.34, 345.45));',
    '  p += dot(p, p + 34.345);',
    '  return fract(p.x * p.y);',
    '}',
    '',
    'float Saw(float b, float t) {',
    '  return smoothstep(0.0, b, t) * smoothstep(1.0, b, t);',
    '}',
    '',
    'vec2 getCoverUV(vec2 uv, float screenAspect, float imgAspect) {',
    '  vec2 c = uv - 0.5;',
    '  if (screenAspect > imgAspect) {',
    '    c.y *= imgAspect / screenAspect;',
    '  } else {',
    '    c.x *= screenAspect / imgAspect;',
    '  }',
    '  return c + 0.5;',
    '}',
    '',
    '// Слой тяжёлых капель с поверхностным натяжением и мокрыми дорожками',
    'vec4 DropLayer(vec2 uv, float t) {',
    '  vec2 UV = uv;',
    '  uv.y += t * 0.24;',
    '  vec2 a = vec2(6.0, 1.0);',
    '  vec2 grid = a * 2.0;',
    '  vec2 id = floor(uv * grid);',
    '',
    '  float colShift = N21(vec2(id.x, 17.3));',
    '  uv.y += colShift;',
    '  id = floor(uv * grid);',
    '  vec3 n = N13(id.x * 35.2 + id.y * 2376.1);',
    '  vec2 st = fract(uv * grid) - vec2(0.5, 0.0);',
    '',
    '  float x = n.x - 0.5;',
    '  float y = UV.y * 20.0;',
    '  float wiggle = sin(y + sin(y));',
    '  x += wiggle * (0.5 - abs(x)) * (n.z - 0.5);',
    '  x *= 0.72;',
    '',
    '  float ti = fract(t * 0.21 + n.z);',
    '  y = (Saw(0.85, ti) - 0.5) * 0.88 + 0.5;',
    '  vec2 p = vec2(x, y);',
    '',
    '  vec2 dp = (st - p) * a.yx;',
    '  dp.y *= 1.15;',
    '  float d = length(dp);',
    '  float mainDrop = smoothstep(0.36, 0.02, d);',
    '',
    '  float r = sqrt(smoothstep(1.0, y, st.y));',
    '  float cd = abs(st.x - x);',
    '  float trail = smoothstep(0.22 * r, 0.14 * r * r, cd);',
    '  float trailFront = smoothstep(-0.02, 0.02, st.y - y);',
    '  trail *= trailFront * r * r;',
    '',
    '  float y2 = fract(UV.y * 10.0) + (st.y - 0.5);',
    '  vec2 td = (st - vec2(x, y2)) * a.yx;',
    '  float dd = length(td);',
    '  float droplets = smoothstep(0.30, 0.02, dd) * trailFront * r;',
    '',
    '  float m = clamp(mainDrop + droplets * 0.65, 0.0, 1.0);',
    '  vec2 normal = dp * mainDrop * 2.4 + td * droplets * 1.1;',
    '  float fogClear = clamp(trail * 0.95 + mainDrop, 0.0, 1.0);',

    '  return vec4(normal, m, fogClear);',
    '}',
    '',
    '// Мелкие статичные капли на стекле',
    'vec3 StaticDrops(vec2 uv, float t) {',
    '  uv *= 32.0;',
    '  vec2 id = floor(uv);',
    '  uv = fract(uv) - 0.5;',
    '  vec3 n = N13(id.x * 107.45 + id.y * 3543.654);',
    '  vec2 p = (n.xy - 0.5) * 0.68;',
    '  vec2 dVec = uv - p;',
    '  float d = length(dVec);',
    '  float fade = Saw(0.025, fract(t * 0.08 + n.z));',
    '  float c = smoothstep(0.28, 0.02, d) * fract(n.z * 10.0) * fade;',

    '}',
    '',
    '// Мягкое кинематографичное боке-размытие',
    'vec3 sampleBlurredBg(vec2 uv, float blurRadius) {',
    '  if (blurRadius <= 0.0008) {',
    '    return texture2D(u_bgTex, clamp(uv, 0.002, 0.998)).rgb;',
    '  }',
    '  vec3 col = texture2D(u_bgTex, clamp(uv, 0.002, 0.998)).rgb * 0.16;',
    '  float aspect = u_resolution.x / max(u_resolution.y, 1.0);',
    '  vec2 scale = vec2(blurRadius / aspect, blurRadius);',
    '',
    '  col += texture2D(u_bgTex, clamp(uv + vec2( 0.866,  0.500) * scale * 0.55, 0.002, 0.998)).rgb * 0.09;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2(-0.866,  0.500) * scale * 0.55, 0.002, 0.998)).rgb * 0.09;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2( 0.000, -1.000) * scale * 0.55, 0.002, 0.998)).rgb * 0.09;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2( 0.500, -0.866) * scale * 0.85, 0.002, 0.998)).rgb * 0.075;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2(-0.500, -0.866) * scale * 0.85, 0.002, 0.998)).rgb * 0.075;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2( 1.000,  0.000) * scale * 0.85, 0.002, 0.998)).rgb * 0.075;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2(-1.000,  0.000) * scale * 0.85, 0.002, 0.998)).rgb * 0.075;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2( 0.707,  0.707) * scale * 1.15, 0.002, 0.998)).rgb * 0.065;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2(-0.707,  0.707) * scale * 1.15, 0.002, 0.998)).rgb * 0.065;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2( 0.707, -0.707) * scale * 1.15, 0.002, 0.998)).rgb * 0.065;',
    '  col += texture2D(u_bgTex, clamp(uv + vec2(-0.707, -0.707) * scale * 1.15, 0.002, 0.998)).rgb * 0.065;',
    '  return col;',
    '}',
    '',
    'void main() {',
    '  float screenAspect = u_resolution.x / max(u_resolution.y, 1.0);',
    '  vec2 rainUV = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;',
    '  vec2 bgUV = getCoverUV(v_uv, screenAspect, u_bgAspect);',
    '',
    '  float t = u_time * (0.62 + u_rainIntensity * 0.55);',
    '',
    '  vec4 layer1 = DropLayer(rainUV * 1.15, t);',
    '  vec4 layer2 = DropLayer(rainUV * 1.85 + vec2(4.2, 1.7), t * 0.82 + 12.4) * smoothstep(0.2, 0.85, u_rainIntensity);',
    '  vec3 stat = StaticDrops(rainUV, u_time) * (0.55 + u_rainIntensity * 0.55);',
    '',
    '  float dropMask = clamp(layer1.z + layer2.z * 0.85 + stat.z * 0.55, 0.0, 1.0);',
    '  float trailClear = clamp(layer1.w + layer2.w * 0.75, 0.0, 1.0);',
    '  float fingerWipe = texture2D(u_wipeTex, v_uv).r;',
    '',
    '  float effectiveFog = u_fogDensity * (1.0 - clamp(fingerWipe * 1.15 + trailClear * 0.88 + dropMask * 0.95, 0.0, 1.0));',
    '',
    '  // Оптическое преломление внутри капель',
    '  vec2 normal = layer1.xy * 1.15 + layer2.xy * 0.75 + stat.xy * 0.35;',
    '  vec2 refractedUV = bgUV - normal * (0.048 + dropMask * 0.032);',
    '',
    '  float baseBlur = 0.004 + effectiveFog * 0.044;',
    '  float dropBlur = mix(baseBlur, 0.001, clamp(dropMask * 1.2 + fingerWipe * 0.85, 0.0, 1.0));',
    '',
    '  vec3 col = sampleBlurredBg(refractedUV, dropBlur);',
    '',
    '  // Конденсат и микрозерно на запотевших участках',
    '  float grain = (N21(v_uv * u_resolution.xy * 0.35 + fract(u_time * 0.01)) - 0.5) * 0.024;',
    '  vec3 fogTint = vec3(0.085, 0.115, 0.165);',
    '  col = mix(col, col * 0.76 + fogTint, effectiveFog * 0.52);',
    '  col += grain * effectiveFog;',
    '',
    '  // Оптические блики и тёмная кайма капель',
    '  vec2 lightDir = normalize(vec2(0.35, 0.85));',
    '  float spec = pow(clamp(dot(normalize(normal + vec2(0.0001)), lightDir), 0.0, 1.0), 6.0) * dropMask;',
    '  float rim = smoothstep(0.08, 0.45, length(normal)) * dropMask;',
    '  col += vec3(0.72, 0.84, 1.0) * spec * (0.18 + u_lightning * 0.45);',
    '  col *= 1.0 - rim * 0.16;',
    '',
    '  // Ночная киношная цветокоррекция',
    '  col = pow(max(col, vec3(0.0)), vec3(1.06));',
    '  col *= vec3(0.92, 0.96, 1.05);',
    '',
    '  // Вспышка далёкой молнии',
    '  if (u_lightning > 0.001) {',
    '    float skyGlow = smoothstep(0.1, 1.0, v_uv.y);',
    '    vec3 flashCol = vec3(0.56, 0.72, 0.96);',
    '    col += flashCol * u_lightning * (0.28 + skyGlow * 0.55 + effectiveFog * 0.22);',
    '  }',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  var gl = null;
  var canvas = null;
  var program = null;
  var locs = {};
  var bgTex = null;
  var wipeTex = null;
  var wipeCanvas = null;
  var wipeCtx = null;

  var bgAspect = 9 / 16;
  var rainIntensity = 0.75;
  var fogDensity = 0.72;
  var lightning = 0;
  var startTime = performance.now();
  var lastFadeTime = performance.now();
  var wipeDirty = true;
  var isDrawing = false;
  var lastPoint = null;
  var firstWipeCb = null;
  var hasWipedOnce = false;
  var rafId = null;

  function compileShader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('GLSL error:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  // Встроенный фотореалистичный ночной город в расфокусе (работает сразу без картинок)
  function createFallbackNightCityCanvas() {
    var c = document.createElement('canvas');
    c.width = 720;
    c.height = 1280;
    var ctx = c.getContext('2d');

    var sky = ctx.createLinearGradient(0, 0, 0, c.height);
    sky.addColorStop(0.0, '#04070e');
    sky.addColorStop(0.35, '#091020');
    sky.addColorStop(0.68, '#131d31');
    sky.addColorStop(0.84, '#1b2232');
    sky.addColorStop(1.0, '#080b12');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, c.width, c.height);

    var horizonGlow = ctx.createRadialGradient(360, 880, 30, 360, 880, 520);
    horizonGlow.addColorStop(0, 'rgba(218, 134, 78, 0.32)');
    horizonGlow.addColorStop(0.45, 'rgba(72, 108, 164, 0.22)');
    horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(0, 0, c.width, c.height);

    ctx.fillStyle = '#070b14';
    var buildings = [
      [0, 480, 120, 800],
      [95, 360, 135, 920],
      [215, 520, 110, 760],
      [310, 410, 145, 870],
      [440, 470, 120, 810],
      [545, 340, 175, 940]
    ];
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      ctx.fillRect(b[0], b[1], b[2], b[3]);
    }

    var seed = 42;
    function rand() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    for (var j = 0; j < buildings.length; j++) {
      var bx = buildings[j][0];
      var by = buildings[j][1];
      var bw = buildings[j][2];
      for (var wy = by + 26; wy < 940; wy += 28) {
        for (var wx = bx + 16; wx < bx + bw - 20; wx += 22) {
          if (rand() > 0.84) {
            var warm = rand() > 0.35;
            ctx.fillStyle = warm
              ? 'rgba(255, 198, 132, ' + (0.28 + rand() * 0.48).toFixed(2) + ')'
              : 'rgba(150, 200, 255, ' + (0.22 + rand() * 0.40).toFixed(2) + ')';
            ctx.fillRect(wx, wy, 10, 14);
          }
        }
      }
    }

    var lights = [
      { x: 110, y: 840, r: 95, col: 'rgba(255, 168, 86, 0.58)' },
      { x: 240, y: 920, r: 120, col: 'rgba(255, 132, 68, 0.50)' },
      { x: 470, y: 860, r: 110, col: 'rgba(255, 192, 118, 0.62)' },
      { x: 615, y: 780, r: 90, col: 'rgba(116, 178, 245, 0.44)' },
      { x: 355, y: 960, r: 140, col: 'rgba(240, 82, 74, 0.42)' },
      { x: 155, y: 1020, r: 105, col: 'rgba(120, 185, 255, 0.36)' },
      { x: 560, y: 990, r: 125, col: 'rgba(255, 160, 88, 0.52)' },
      { x: 300, y: 760, r: 75, col: 'rgba(195, 222, 255, 0.32)' },
      { x: 640, y: 920, r: 85, col: 'rgba(235, 76, 88, 0.44)' }
    ];

    for (var k = 0; k < lights.length; k++) {
      var L = lights[k];
      var g = ctx.createRadialGradient(L.x, L.y, 4, L.x, L.y, L.r);
      g.addColorStop(0, L.col);
      g.addColorStop(0.45, L.col.replace(/[\d.]+\)$/, '0.18)'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(L.x, L.y, L.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (var m = 0; m < 28; m++) {
      var lx = rand() * c.width;
      var ly = 620 + rand() * 520;
      var lr = 8 + rand() * 26;
      var pick = rand();
      var core = pick < 0.55
        ? 'rgba(255, 214, 154, 0.72)'
        : pick < 0.8
          ? 'rgba(148, 206, 255, 0.55)'
          : 'rgba(255, 92, 86, 0.60)';
      var cg = ctx.createRadialGradient(lx, ly, 1, lx, ly, lr);
      cg.addColorStop(0, core);
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(lx, ly, lr, 0, Math.PI * 2);
      ctx.fill();
    }

    return c;
  }

  function setupTexture(tex, source) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  }

  function initWipeCanvas() {
    wipeCanvas = document.createElement('canvas');
    wipeCanvas.width = 256;
    wipeCanvas.height = 512;
    wipeCtx = wipeCanvas.getContext('2d');
    wipeCtx.fillStyle = '#000000';
    wipeCtx.fillRect(0, 0, wipeCanvas.width, wipeCanvas.height);
    wipeDirty = true;
  }

  function paintWipeStroke(from, to) {
    if (!wipeCtx || !canvas) return;
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    var x0 = ((from.x - rect.left) / rect.width) * wipeCanvas.width;
    var y0 = ((from.y - rect.top) / rect.height) * wipeCanvas.height;
    var x1 = ((to.x - rect.left) / rect.width) * wipeCanvas.width;
    var y1 = ((to.y - rect.top) / rect.height) * wipeCanvas.height;

    var dist = Math.hypot(x1 - x0, y1 - y0);
    var steps = Math.max(1, Math.ceil(dist / 4));
    var radius = Math.max(18, wipeCanvas.width * 0.095);

    for (var i = 0; i <= steps; i++) {
      var k = i / steps;
      var cx = x0 + (x1 - x0) * k;
      var cy = y0 + (y1 - y0) * k;
      var grad = wipeCtx.createRadialGradient(cx, cy, radius * 0.15, cx, cy, radius);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.52)');
      grad.addColorStop(0.55, 'rgba(255, 255, 255, 0.22)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      wipeCtx.fillStyle = grad;
      wipeCtx.beginPath();
      wipeCtx.arc(cx, cy, radius, 0, Math.PI * 2);
      wipeCtx.fill();
    }

    wipeDirty = true;
    if (!hasWipedOnce) {
      hasWipedOnce = true;

  var RainWindow = {
    init: function (canvasEl) {
      canvas = canvasEl;
      if (!canvas) return false;

      gl = canvas.getContext('webgl', {
        alpha: false,
        antialias: false,
        depth: false,
        preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
      }) || canvas.getContext('experimental-webgl');

      if (!gl) return false;

      var vs = compileShader(gl.VERTEX_SHADER, VERT_SRC);
      var fs = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
      if (!vs || !fs) return false;

      program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return false;

      var quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

      var aPos = gl.getAttribLocation(program, 'a_pos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      locs = {
        u_resolution: gl.getUniformLocation(program, 'u_resolution'),
        u_time: gl.getUniformLocation(program, 'u_time'),
        u_bgTex: gl.getUniformLocation(program, 'u_bgTex'),
        u_wipeTex: gl.getUniformLocation(program, 'u_wipeTex'),
        u_bgAspect: gl.getUniformLocation(program, 'u_bgAspect'),
        u_rainIntensity: gl.getUniformLocation(program, 'u_rainIntensity'),
        u_fogDensity: gl.getUniformLocation(program, 'u_fogDensity'),
        u_lightning: gl.getUniformLocation(program, 'u_lightning')
      };

      bgTex = gl.createTexture();
      wipeTex = gl.createTexture();

      setBackgroundSource(createFallbackNightCityCanvas());
      tryLoadDefaultBg();

      initWipeCanvas();
      bindPointerEvents();
      resize();
      window.addEventListener('resize', resize);

      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(render);
      return true;
    },

    setBackgroundImage: function (img) {
      setBackgroundSource(img);
    },

    setRainIntensity: function (val) {
      rainIntensity = Math.max(0.1, Math.min(1.0, val));
    },

    setFogDensity: function (val) {
      fogDensity = Math.max(0.0, Math.min(1.0, val));
    },

    resetFog: function () {
      if (!wipeCtx) return;
      wipeCtx.fillStyle = '#000000';
      wipeCtx.fillRect(0, 0, wipeCanvas.width, wipeCanvas.height);
      wipeDirty = true;
    },

    clearFog: function () {
      if (!wipeCtx) return;
      wipeCtx.fillStyle = '#ffffff';
      wipeCtx.fillRect(0, 0, wipeCanvas.width, wipeCanvas.height);
      wipeDirty = true;
    },

    triggerLightning: function (strength) {
      var s = typeof strength === 'number' ? strength : 0.9;
      lightning = Math.max(lightning, s);
      setTimeout(function () {
        lightning = Math.max(lightning, s * 0.65);
      }, 145);
    },

    onFirstWipe: function (cb) {
      firstWipeCb = cb;
    }
  };

  global.RainWindow = RainWindow;
})(window);

  var memoryFallback = {};

    get: function (key, defaultVal) {
      try {
        var raw = window.localStorage.getItem(key);

      } catch (e) {}
      return Object.prototype.hasOwnProperty.call(memoryFallback, key)
        ? memoryFallback[key]
        : defaultVal;
    },
    set: function (key, value) {
      memoryFallback[key] = String(value);
      try {
        window.localStorage.setItem(key, String(value));
      } catch (e) {}
    },
    getJSON: function (key, defaultVal) {
      var raw = this.get(key, null);
      if (!raw) return defaultVal;
      try {
        return JSON.parse(raw);
      } catch (e) {
        return defaultVal;
      }
    },
    setJSON: function (key, obj) {
      try {
        this.set(key, JSON.stringify(obj));

      ];
      files.forEach(function (src, idx) {
        var img = new Image();
        img.onload = function () {
          if (img.naturalWidth > 8 && img.naturalHeight > 8) {
            self.photos.push({ id: 'default_' + idx, src: src });
            self.render();
          }
        };
        img.src = src;
      });
    },

    getCurrentId: function () {
      if (!this.photos.length) return 'empty';
      return this.photos[this.index].id;
    },

    getCaption: function () {
      var id = this.getCurrentId();
      if (state.captions[id]) return state.captions[id];
      return NIGHT_PHRASES[this.index % NIGHT_PHRASES.length];
    },

    render: function () {
      var count = this.photos.length;
      if (count === 0) {
        els.polaroidCounter.textContent = '0 / 0';
        els.polaroidImg.classList.add('is-empty');
        els.polaroidImg.removeAttribute('src');
        els.polaroidEmpty.classList.remove('hidden');
      } else {
        this.index = (this.index + count) % count;
        els.polaroidCounter.textContent = (this.index + 1) + ' / ' + count;
        els.polaroidImg.src = this.photos[this.index].src;
        els.polaroidImg.classList.remove('is-empty');
        els.polaroidEmpty.classList.add('hidden');
      }
      els.polaroidCaption.textContent = this.getCaption();
    },

    next: function () {
      if (this.photos.length <= 1) return;
      this.index = (this.index + 1) % this.photos.length;
      this.render();
    },

    prev: function () {
      if (this.photos.length <= 1) return;
      this.index = (this.index - 1 + this.photos.length) % this.photos.length;
      this.render();
    },

    setExpanded: function (flag) {
      this.expanded = flag;
      els.polaroidCard.classList.toggle('expanded', flag);
      els.polaroidBackdrop.classList.toggle('hidden', !flag);
    },

    bindEvents: function () {
      var self = this;

      els.btnAddPhotos.addEventListener('click', function (e) {
        e.stopPropagation();
        els.inputPhotos.click();
      });

      els.inputPhotos.addEventListener('change', function (e) {
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        var startIdx = self.photos.length;
        files.forEach(function (file, i) {
          self.photos.push({
            id: 'local_' + file.name + '_' + file.size + '_' + i,
            src: URL.createObjectURL(file)
          });
        });
        self.index = startIdx;
        self.render();
        e.target.value = '';
      });

      els.btnPhotoNext.addEventListener('click', function (e) {
        e.stopPropagation();
        self.next();
      });

      els.btnPhotoPrev.addEventListener('click', function (e) {
        e.stopPropagation();
        self.prev();
      });

      els.btnClosePolaroid.addEventListener('click', function (e) {
        e.stopPropagation();
        self.setExpanded(false);
      });

      els.polaroidBackdrop.addEventListener('click', function () {
        self.setExpanded(false);
      });

      // Свайп для листания и тап для раскрытия
      els.polaroidFrame.addEventListener('pointerdown', function (e) {
        self.touchStartX = e.clientX;
        self.touchMoved = false;
      });

      els.polaroidFrame.addEventListener('pointermove', function (e) {
        if (Math.abs(e.clientX - self.touchStartX) > 14) {
          self.touchMoved = true;
        }
      });

      els.polaroidFrame.addEventListener('pointerup', function (e) {
        var dx = e.clientX - self.touchStartX;
        if (Math.abs(dx) > 36 && self.photos.length > 1) {
          if (dx < 0) self.next();
          else self.prev();
          return;
        }
        if (!self.touchMoved) {
          if (!self.photos.length) {
            els.inputPhotos.click();
          } else {
            self.setExpanded(!self.expanded);
          }
        }
      });

      // Редактирование подписи
      els.btnEditCaption.addEventListener('click', function (e) {
        e.stopPropagation();
        els.captionInput.value = self.getCaption();
        els.captionModal.classList.remove('hidden');
        setTimeout(function () { els.captionInput.focus(); }, 50);
      });

      els.btnCancelCaption.addEventListener('click', function () {
        els.captionModal.classList.add('hidden');
      });

      els.btnRandomPhrase.addEventListener('click', function () {
        var pick = NIGHT_PHRASES[Math.floor(Math.random() * NIGHT_PHRASES.length)];
        els.captionInput.value = pick;
      });

      els.btnSaveCaption.addEventListener('click', function () {
        var text = els.captionInput.value.trim();
        var id = self.getCurrentId();
        if (text) state.captions[id] = text;
        else delete state.captions[id];
        SafeStorage.setJSON('okno3am_captions', state.captions);
        self.render();
        els.captionModal.classList.add('hidden');
      });

      els.captionModal.addEventListener('click', function (e) {
        if (e.target === els.captionModal) {
          els.captionModal.classList.add('hidden');
        }
      });
    }
  };

  // ===== 5. Часы, ночные записки, молния и настройки =====
  function updateClock() {
    if (!state.realClock) {
      els.clockTime.textContent = '03:00';
      els.clockSub.textContent = 'дождь · тихо';
      return;
    }
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    els.clockTime.textContent = hh + ':' + mm;
    els.clockSub.textContent = 'сейчас · за окном дождь';
  }

  function showNextNote() {
    state.noteIndex = (state.noteIndex + 1) % NIGHT_PHRASES.length;
    els.noteText.style.opacity = '0';
    setTimeout(function () {
      els.noteText.textContent = NIGHT_PHRASES[state.noteIndex];
      els.noteText.style.opacity = '1';
    }, 180);
  }

  function scheduleAutoLightning() {
    var delay = 24000 + Math.random() * 32000;
    setTimeout(function () {
      if (window.RainWindow && state.rainIntensity >= 40) {
        window.RainWindow.triggerLightning(0.85 + Math.random() * 0.15);
      }
      scheduleAutoLightning();
    }, delay);
  }

  function syncSettingsUI() {
    els.sliderRainIntensity.value = state.rainIntensity;
    els.valRainIntensity.textContent = state.rainIntensity + '%';

    els.sliderFog.value = state.fogDensity;
    els.valFog.textContent = state.fogDensity + '%';

    if (window.RainWindow) {
      window.RainWindow.setRainIntensity(state.rainIntensity / 100);
      window.RainWindow.setFogDensity(state.fogDensity / 100);
    }
  }

  function bindGlobalUI() {
    els.clockWidget.addEventListener('click', function () {
      state.realClock = !state.realClock;
      updateClock();
    });

    els.btnFog.addEventListener('click', function () {
      if (window.RainWindow) window.RainWindow.resetFog();
    });

    els.btnThunder.addEventListener('click', function () {
      if (window.RainWindow) window.RainWindow.triggerLightning(0.95);
    });

    els.btnNextNote.addEventListener('click', showNextNote);

    els.btnQuickBg.addEventListener('click', function () {
      els.inputBg.click();
    });

    els.btnQuickClear.addEventListener('click', function () {
      if (window.RainWindow) window.RainWindow.clearFog();
    });

    els.btnSettings.addEventListener('click', function () {
      els.settingsSheet.classList.remove('hidden');
    });

    els.btnCloseSettings.addEventListener('click', function () {
      els.settingsSheet.classList.add('hidden');
    });

    els.settingsSheet.addEventListener('click', function (e) {
      if (e.target === els.settingsSheet) {
        els.settingsSheet.classList.add('hidden');
      }
    });

    els.sliderRainIntensity.addEventListener('input', function () {
      state.rainIntensity = Number(this.value);
      els.valRainIntensity.textContent = state.rainIntensity + '%';
      if (window.RainWindow) window.RainWindow.setRainIntensity(state.rainIntensity / 100);
      saveSettings();
    });

    els.sliderFog.addEventListener('input', function () {
      state.fogDensity = Number(this.value);
      els.valFog.textContent = state.fogDensity + '%';
      if (window.RainWindow) window.RainWindow.setFogDensity(state.fogDensity / 100);
      saveSettings();
    });

    els.btnClearFog.addEventListener('click', function () {
      if (window.RainWindow) window.RainWindow.clearFog();
      els.settingsSheet.classList.add('hidden');
    });

    els.btnCustomBg.addEventListener('click', function () {
      els.inputBg.click();
    });

    els.inputBg.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        if (window.RainWindow) window.RainWindow.setBackgroundImage(img);
      };
      img.src = url;
      els.settingsSheet.classList.add('hidden');
      e.target.value = '';
    });
  }

  // ===== 6. Старт =====
  function bootstrap() {
    if (window.RainWindow) {
      window.RainWindow.init(els.canvas);
      window.RainWindow.onFirstWipe(function () {
        if (els.wipeHint) els.wipeHint.classList.add('fade-out');
      });
    }

    syncSettingsUI();
    updateClock();
    setInterval(updateClock, 15000);
    scheduleAutoLightning();

    Polaroid.init();
    bindGlobalUI();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
})();

</script>
