<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Неон Бит-Пад</title>
  <style data-file="css/style.css">
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #1d1848, #08080e 72%);
  color: #f4f5fa;
}
.panel {
  width: 100%;
  max-width: 315px;
  background: rgba(18, 18, 28, 0.92);
  border: 1.5px solid rgba(124, 92, 255, 0.45);
  border-radius: 26px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: #b8a5ff;
  background: rgba(124, 92, 255, 0.18);
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 10px;
}
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { font-size: 12px; color: #9598b3; margin-bottom: 16px; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.pad {
  aspect-ratio: 1;
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  background: #141421;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.12s ease;
}
.pad.lit {
  transform: scale(0.93);
  border-color: #fff;
}
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #a1a5c2;
}
#comboBtn {
  border: none;
  border-radius: 12px;
  padding: 8px 14px;
  background: linear-gradient(135deg, #7c5cff, #ec4899);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
</style>
<script>
(function(){
  function showErr(msg){
    var b = document.getElementById("__dc_err_bar");
    if(!b){
      b = document.createElement("div");
      b.id = "__dc_err_bar";
      b.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:999999;background:#2b1218;color:#fecdd3;border:1px solid #f43f5e;border-radius:12px;padding:10px 12px;font:12px/1.4 monospace;box-shadow:0 8px 24px rgba(0,0,0,.45);word-break:break-word;";
      (document.body || document.documentElement).appendChild(b);
    }
    b.textContent = "Ошибка в коде: " + msg;
  }
  window.addEventListener("error", function(e){ showErr(e.message || "Неизвестная ошибка"); });
  window.addEventListener("unhandledrejection", function(e){ showErr((e.reason && e.reason.message) || String(e.reason)); });
})();
</script>
</head>
<body>
  <div class="panel">
    <div class="badge">⚡ Проект Антона</div>
    <h1>Neon Beat Pad</h1>
    <p class="sub" id="status">Нажимай на неоновые пэды!</p>
    <div class="grid" id="padGrid"></div>
    <div class="bar">
      <span>Нажатий: <b id="hits">0</b></span>
      <button id="comboBtn">Авто-ритм ▶</button>
    </div>
  </div>
  <script data-file="js/app.js">
const pads = [
  { label: "DO", freq: 261.6, color: "#ff5e9c" },
  { label: "RE", freq: 293.7, color: "#ff9966" },
  { label: "MI", freq: 329.6, color: "#ffe066" },
  { label: "FA", freq: 349.2, color: "#4cd97b" },
  { label: "SOL", freq: 392.0, color: "#38bdf8" },
  { label: "LA", freq: 440.0, color: "#818cf8" },
  { label: "SI", freq: 493.9, color: "#c084fc" },
  { label: "HI", freq: 523.3, color: "#f472b6" },
  { label: "⚡", freq: 659.3, color: "#22d3ee" }
];
let audioCtx = null;
let hits = 0;
let autoTimer = null;
const grid = document.getElementById("padGrid");
const hitsEl = document.getElementById("hits");
const statusEl = document.getElementById("status");
const comboBtn = document.getElementById("comboBtn");

function playTone(freq) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.26);
  } catch (e) {}
}

const padEls = pads.map((p) => {
  const b = document.createElement("button");
  b.className = "pad";
  b.textContent = p.label;
  b.style.color = p.color;
  b.onclick = () => trigger(b, p);
  grid.appendChild(b);
  return { el: b, pad: p };
});

function trigger(el, p) {
  hits++;
  hitsEl.textContent = hits;
  statusEl.textContent = "Нота " + p.label + " • вайб на максимуме ✨";
  el.classList.add("lit");
  el.style.background = p.color;
  el.style.color = "#08080e";
  el.style.boxShadow = "0 0 22px " + p.color;
  playTone(p.freq);
  setTimeout(() => {
    el.classList.remove("lit");
    el.style.background = "#141421";
    el.style.color = p.color;
    el.style.boxShadow = "none";
  }, 190);
}

comboBtn.onclick = () => {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    comboBtn.textContent = "Авто-ритм ▶";
    return;
  }
  comboBtn.textContent = "Стоп ■";
  const seq = [0, 2, 4, 7, 4, 5, 3, 8];
  let step = 0;
  autoTimer = setInterval(() => {
    const item = padEls[seq[step % seq.length]];
    trigger(item.el, item.pad);
    step++;
  }, 240);
};
</script>
</body>
</html>
